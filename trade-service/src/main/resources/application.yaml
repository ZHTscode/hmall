server:
  port: 8084
feign:
  okhttp:
    enabled: true # 开启OKHttp功能
  sentinel:
    enabled: true # 开启Feign的Sentinel功能
hm:
  db:
    database: hm-item
  swagger:
    title: "黑马商城交易管理接口文档"
    package: "com.hmall.trade.controller"
spring:
  cloud:
    sentinel:
      transport:
        dashboard: localhost:8090
      http-method-specify: true # 设置请求方式作为资源名称